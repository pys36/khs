let currentIndex = 0;
let userAnswers = new Array(questions.length).fill(null);
let studentName = "";
let studentClass = "";

function startQuiz() {
    studentName = document.getElementById("student-name").value.trim();
    studentClass = document.getElementById("student-class").value.trim();
    
    if (!studentName || !studentClass) {
        alert("Sila masukkan Nama dan Kelas anda terlebih dahulu.");
        return;
    }

    document.getElementById("start-page").classList.add("hidden");
    document.getElementById("quiz-page").classList.remove("hidden");
    loadQuestion();
}

function loadQuestion() {
    const qData = questions[currentIndex];
    document.getElementById("progress-text").innerText = `Soalan ${currentIndex + 1} daripada ${questions.length}`;
    document.getElementById("question-text").innerHTML = `<p style="font-size:16px; font-weight:bold; line-height:1.5;">${qData.q}</p>`;

    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";

    const feedbackBox = document.getElementById("feedback-box");
    const hasAnswered = userAnswers[currentIndex] !== null;

    qData.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = opt;
        
        btn.onclick = () => selectOption(idx);

        if (hasAnswered) {
            btn.disabled = true;
            if (idx === qData.ans) {
                btn.style.backgroundColor = "#d4edda";
                btn.style.borderColor = "#c3e6cb";
                btn.style.fontWeight = "bold";
            }
            if (idx === userAnswers[currentIndex] && idx !== qData.ans) {
                btn.style.backgroundColor = "#f8d7da";
                btn.style.borderColor = "#f5c6cb";
            }
        }

        optionsContainer.appendChild(btn);
    });

    if (hasAnswered) {
        showFeedback(userAnswers[currentIndex], qData.ans);
    } else {
        feedbackBox.classList.add("hidden");
    }

    document.getElementById("prev-btn").disabled = currentIndex === 0;
    if (currentIndex === 0) {
        document.getElementById("prev-btn").classList.add("btn-disabled");
    } else {
        document.getElementById("prev-btn").classList.remove("btn-disabled");
    }

    const nextBtn = document.getElementById("next-btn");
    if (currentIndex === questions.length - 1) {
        nextBtn.innerText = "Hantar & Lihat Keputusan";
    } else {
        nextBtn.innerText = "Seterusnya";
    }
}

function showFeedback(selectedIndex, correctIndex) {
    const feedbackBox = document.getElementById("feedback-box");
    feedbackBox.classList.remove("hidden");
    
    if (selectedIndex === correctIndex) {
        feedbackBox.className = "feedback correct";
        feedbackBox.innerText = "✓ Jawapan Anda BETUL!";
    } else {
        const correctLetter = String.fromCharCode(65 + correctIndex);
        feedbackBox.className = "feedback wrong";
        feedbackBox.innerText = `✗ Jawapan Anda SALAH. Jawapan yang betul ialah pilihan ${correctLetter}.`;
    }
}

function selectOption(index) {
    if (userAnswers[currentIndex] !== null) return;
    
    userAnswers[currentIndex] = index;
    const qData = questions[currentIndex];
    const buttons = document.querySelectorAll("#options-container .option-btn");

    buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === qData.ans) {
            btn.style.backgroundColor = "#d4edda";
            btn.style.borderColor = "#c3e6cb";
            btn.style.fontWeight = "bold";
        }
        if (idx === index && idx !== qData.ans) {
            btn.style.backgroundColor = "#f8d7da";
            btn.style.borderColor = "#f5c6cb";
        }
    });

    showFeedback(index, qData.ans);
}

function prevQuestion() {
    if (currentIndex > 0) {
        currentIndex--;
        loadQuestion();
    }
}

function nextQuestion() {
    if (currentIndex < questions.length - 1) {
        currentIndex++;
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz-page").classList.add("hidden");
    document.getElementById("result-page").classList.remove("hidden");

    let score = 0;
    userAnswers.forEach((ans, idx) => {
        if (ans === questions[idx].ans) {
            score++;
        }
    });

    const percentage = ((score / questions.length) * 100).toFixed(1);

    document.getElementById("res-name").innerText = studentName;
    document.getElementById("res-class").innerText = studentClass;
    document.getElementById("res-score").innerText = `${score} / ${questions.length}`;
    document.getElementById("res-percentage").innerText = `${percentage}%`;
}
</script>
