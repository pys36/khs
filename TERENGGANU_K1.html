let currentQ = 0;
let userAnswers = new Array(questions.length).fill(null);
let studentName = "";
let studentClass = "";

function startQuiz() {
    studentName = document.getElementById('student-name').value.trim();
    studentClass = document.getElementById('student-class').value.trim();

    if (!studentName || !studentClass) {
        alert("Sila masukkan Nama dan Kelas anda terlebih dahulu!");
        return;
    }

    document.getElementById('start-page').classList.add('hidden');
    document.getElementById('quiz-page').classList.remove('hidden');
    loadQuestion();
}

function loadQuestion() {
    document.getElementById('progress-text').innerText = `Soalan ${currentQ + 1} daripada ${questions.length}`;
    document.getElementById('question-text').innerHTML = questions[currentQ].q;
    
    const optionsContainer = document.getElementById('options-container');
    const feedbackContainer = document.getElementById('feedback-container');
    
    optionsContainer.innerHTML = '';
    feedbackContainer.innerHTML = '';

    const answered = userAnswers[currentQ] !== null;

    questions[currentQ].options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = opt;

        if (answered) {
            btn.disabled = true;
            if (index === userAnswers[currentQ]) {
                if (index === questions[currentQ].ans) {
                    btn.classList.add('selected-correct');
                } else {
                    btn.classList.add('selected-wrong');
                }
            } else if (index === questions[currentQ].ans) {
                btn.classList.add('show-correct');
            }
        } else {
            btn.onclick = () => checkAnswer(index);
        }

        optionsContainer.appendChild(btn);
    });

    if (answered) {
        showFeedback(userAnswers[currentQ]);
    }

    document.getElementById('prev-btn').disabled = (currentQ === 0);
    if (currentQ === 0) {
        document.getElementById('prev-btn').classList.add('btn-disabled');
    } else {
        document.getElementById('prev-btn').classList.remove('btn-disabled');
    }

    if (currentQ === questions.length - 1) {
        document.getElementById('next-btn').innerText = "Selesai & Hantar";
    } else {
        document.getElementById('next-btn').innerText = "Seterusnya";
    }
}

function checkAnswer(selectedIndex) {
    userAnswers[currentQ] = selectedIndex;
    loadQuestion();
}

function showFeedback(selectedIndex) {
    const feedbackContainer = document.getElementById('feedback-container');
    const correctIndex = questions[currentQ].ans;

    if (selectedIndex === correctIndex) {
        feedbackContainer.innerHTML = `
            <div class="feedback correct">
                Tahniah! Jawapan anda TEPAT. ✔️
            </div>
        `;
    } else {
        const correctText = questions[currentQ].options[correctIndex];
        feedbackContainer.innerHTML = `
            <div class="feedback wrong">
                Jawapan anda KURANG TEPAT. ❌<br>
                <span style="font-weight: normal;">Jawapan yang betul ialah: <strong>${correctText}</strong></span>
            </div>
        `;
    }
}

function prevQuestion() {
    if (currentQ > 0) {
        currentQ--;
        loadQuestion();
    }
}

function nextQuestion() {
    if (userAnswers[currentQ] === null) {
        if (!confirm("Anda belum menjawab soalan ini. Adakah anda pasti mahu meneruskan?")) {
            return;
        }
    }

    if (currentQ < questions.length - 1) {
        currentQ++;
        loadQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById('quiz-page').classList.add('hidden');
    document.getElementById('result-page').classList.remove('hidden');

    let totalScore = 0;
    userAnswers.forEach((ans, idx) => {
        if (ans === questions[idx].ans) {
            totalScore++;
        }
    });

    document.getElementById('res-name').innerText = studentName;
    document.getElementById('res-class').innerText = studentClass;
    document.getElementById('res-score').innerText = `${totalScore} / ${questions.length}`;
    
    const percentage = ((totalScore / questions.length) * 100).toFixed(1);
    document.getElementById('res-percentage').innerText = `Peratusan: ${percentage}%`;
}
